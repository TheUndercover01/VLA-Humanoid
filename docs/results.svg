<rect x="250" y="424" width="464.8" height="14" rx="3" fill="#1e4fa3" opacity=".55"/><text x="722.8" y="436" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" fill="#726657">83</text>
<text x="44" y="474" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#726657">The teacher is the ceiling: it sees the true object positions and is told which command it is on.</text>
<text x="44" y="490" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#726657">The student only has two cameras and the sentence, and has to keep track of its own progress.</text>
